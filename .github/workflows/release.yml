name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    name: Build images and SBOMs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: typescript
            context: typescript
          - name: python
            context: python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: SBOM for the image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}-image.spdx.json
          upload-artifact: false
      - name: SBOM for the source tree
        uses: anchore/sbom-action@v0
        with:
          path: ${{ matrix.context }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}-source.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-*.spdx.json
          if-no-files-found: error

  release:
    name: Create GitHub release with SBOMs
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: sboms
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## / { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $GITHUB_REF_NAME" > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: sboms/*.spdx.json
