[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "secure-mcp-server"
version = "0.1.1"
description = "Secure MCP server template (Python, FastMCP): stdio by default, optional streamable HTTP behind bearer auth, rate limit and request size limit, bound to 127.0.0.1."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Muhammad Basit Ali" }]
dependencies = [
  "fastmcp>=4.0,<5",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.5"]

[project.scripts]
secure-mcp-server = "secure_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_mcp_server"]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
